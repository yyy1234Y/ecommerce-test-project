{% extends "base.html" %}
{% block content %}
<h2>我的订单</h2>
<ul>
    {% for order in orders %}
        <li>
            订单号: {{ order.id }} | 金额: ¥{{ order.total_amount }} | 状态: {{ order.status }} | 时间: {{ order.created_at }}
            <a href="{{ url_for('order.status', order_id=order.id) }}">查看详情</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
