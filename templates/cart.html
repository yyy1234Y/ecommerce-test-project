{% extends "base.html" %}
{% block content %}
<h2>购物车</h2>
{% if cart_items %}
    <table border="1">
        <tr><th>商品</th><th>单价</th><th>数量</th><th>小计</th><th>操作</th></tr>
        {% for item in cart_items %}
        <tr>
            <td>{{ item.product.name }}</td>
            <td>¥{{ item.product.price }}</td>
            <td>
                <form method="post" action="{{ url_for('cart.update', item_id=item.id) }}" style="display:inline;">
                    <input type="number" name="quantity" value="{{ item.quantity }}" min="0" style="width:60px;">
                    <input type="submit" value="更新">
                </form>
            </td>
            <td>¥{{ item.product.price * item.quantity }}</td>
            <td><a href="{{ url_for('cart.remove', item_id=item.id) }}">删除</a></td>
        </tr>
        {% endfor %}
    </table>
    <p>总计: ¥{{ total }}</p>
    <a href="{{ url_for('order.checkout') }}">去结算</a>
{% else %}
    <p>购物车为空</p>
{% endif %}
{% endblock %}
