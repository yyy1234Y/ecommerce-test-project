{% extends "base.html" %}
{% block content %}
<h2>商品列表</h2>
<form method="get">
    <input type="text" name="search" placeholder="搜索商品" value="{{ search }}">
    <select name="category">
        <option value="">全部分类</option>
        {% for c in categories %}
            <option value="{{ c }}" {% if category==c %}selected{% endif %}>{{ c }}</option>
        {% endfor %}
    </select>
    <input type="submit" value="筛选">
</form>
<div>
    {% for product in products %}
        <div class="product">
            <h3>{{ product.name }}</h3>
            <p>价格: ¥{{ product.price }}</p>
            <p>{{ product.description[:50] }}</p>
            <a href="{{ url_for('shop.product_detail', id=product.id) }}">查看详情</a>
        </div>
    {% endfor %}
</div>
{% endblock %}
